version: '3.8'

services:
  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: hms_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - hms_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: hms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hms_network
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: hms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hms_abdm
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: hms_pass
    ports:
      - "5432:5432"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    networks:
      - hms_network

  redis:
    image: redis:7-alpine
    container_name: hms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hms_network

  frontend:
    image: node:22-alpine
    container_name: hms_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - hms_network

  adminer:
    image: adminer
    container_name: hms_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - hms_network
    depends_on:
      - postgres

networks:
  hms_network:
    driver: bridge

volumes:
  hms_pgdata:
