services:
  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: hms_backend
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
    networks:
      - hms_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: hms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hms_network
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:16-alpine
    container_name: hms_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hms_abdm}
      POSTGRES_USER: ${DB_USERNAME:-hms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hms_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-hms_user} -d $${POSTGRES_DB:-hms_abdm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    networks:
      - hms_network

  redis:
    image: redis:7-alpine
    container_name: hms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: hms_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - hms_network

  adminer:
    image: adminer
    container_name: hms_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - hms_network
    depends_on:
      - postgres

networks:
  hms_network:
    driver: bridge

volumes:
  hms_pgdata:
