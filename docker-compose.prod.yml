services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: hms_backend
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    volumes:
      - hms_storage:/var/www/storage/app
    networks:
      - hms_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    container_name: hms_queue
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - ./backend/.env
    volumes:
      - hms_storage:/var/www/storage/app
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3"]
    networks:
      - hms_network
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: hms_nginx
    restart: unless-stopped
    ports:
      - "3015:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - hms_storage:/var/www/storage/app:ro
    networks:
      - hms_network
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:16-alpine
    container_name: hms_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hms_abdm}
      POSTGRES_USER: ${DB_USERNAME:-hms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hms_pass}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-hms_user} -d $${POSTGRES_DB:-hms_abdm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    networks:
      - hms_network

  redis:
    image: redis:7-alpine
    container_name: hms_redis
    restart: unless-stopped
    volumes:
      - hms_redisdata:/data
    networks:
      - hms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.prod
    container_name: hms_frontend
    restart: unless-stopped
    networks:
      - hms_network

networks:
  hms_network:
    driver: bridge

volumes:
  hms_pgdata:
  hms_redisdata:
  hms_storage:
